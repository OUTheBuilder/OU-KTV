name: O|U KTV repaired project checks

on:
  push:
    paths:
      - "OU-KTV-Repaired-v1/ktv-server/**"
      - ".github/workflows/ktv-repair-check.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OU-KTV-Repaired-v1/ktv-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile server.py
      - name: Check JavaScript syntax
        run: node --check static/js/app.js
      - name: Run security smoke tests
        run: python tests/test_security_smoke.py
