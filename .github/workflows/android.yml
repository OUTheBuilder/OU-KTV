name: Build OU KTV Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'OU-KTV-Fresh-Android-Project-v2.zip'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Extract Android project
        run: |
          unzip -q OU-KTV-Fresh-Android-Project-v2.zip -d extracted-project
          test -f extracted-project/OU-KTV-Fresh/app/build.gradle
          test -f extracted-project/OU-KTV-Fresh/settings.gradle
      - name: Build debug APK
        working-directory: extracted-project/OU-KTV-Fresh
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OU-KTV-debug-apk
          path: extracted-project/OU-KTV-Fresh/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
