name: Build OU KTV Android APK
# Builds the uploaded Android source archive into a debug APK artifact.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'OU-KTV-Fresh-Android-Project-v2.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Prepare Android APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted-project
          mkdir -p extracted-project
          unzip -q OU-KTV-Fresh-Android-Project-v2.zip -d extracted-project

          echo "Archive contents:"
          find extracted-project -maxdepth 5 -type f | sort | head -200

          # The current repository archive may be either the original Android
          # source project or an APK artifact that was renamed to .zip.
          PREBUILT_APK="$(find extracted-project -type f -name 'app-debug.apk' -print -quit)"
          if [ -n "$PREBUILT_APK" ]; then
            echo "Detected prebuilt APK: $PREBUILT_APK"
            mkdir -p output-apk
            cp "$PREBUILT_APK" output-apk/app-debug.apk
            echo "APK_PATH=output-apk/app-debug.apk" >> "$GITHUB_ENV"
            echo "BUILD_MODE=prebuilt" >> "$GITHUB_ENV"
            exit 0
          fi

          PROJECT_DIR="$(find extracted-project -type f \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) -print -quit | xargs -r dirname | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Could not locate an Android Gradle project or prebuilt app-debug.apk inside the ZIP."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::Android project was found at $PROJECT_DIR but settings.gradle/settings.gradle.kts is missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "BUILD_MODE=source" >> "$GITHUB_ENV"
          echo "Detected Android source project: $PROJECT_DIR"

      - name: Build debug APK from source
        if: env.BUILD_MODE == 'source'
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BUILD_MODE" = "source" ]; then
            APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print -quit)"
            if [ -z "$APK" ]; then
              echo "::error::Gradle completed but no APK was produced."
              exit 1
            fi
            mkdir -p output-apk
            cp "$APK" output-apk/app-debug.apk
          fi
          test -s output-apk/app-debug.apk
          echo "APK produced: output-apk/app-debug.apk ($BUILD_MODE mode)"
          echo "APK_PATH=output-apk/app-debug.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OU-KTV-debug-apk
          path: output-apk/app-debug.apk
          if-no-files-found: error
