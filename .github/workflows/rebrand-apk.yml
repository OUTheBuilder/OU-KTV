name: Rebrand OU KTV APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/rebrand-apk.yml'
      - 'OU-KTV-Repaired-v1/app.js'
      - 'OU-KTV-Repaired-v1/ktv-server/server.py'
      - 'OU-KTV-Repaired-v1/ktv-server/static/js/app.js'

permissions:
  contents: read

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install APK editing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool apksigner zipalign aapt python3-pil

      - name: Extract existing APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input
          unzip -q OU-KTV-Fresh-Android-Project-v2.zip -d input
          APK="$(find input -type f -name 'app-debug.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::The repository ZIP does not contain app-debug.apk."
            exit 1
          fi
          cp "$APK" original.apk
          echo "Found existing APK: $APK"

      - name: Decode and apply app name and launcher icon
        shell: bash
        run: |
          set -euo pipefail
          apktool d -f original.apk -o decoded
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from PIL import Image, ImageDraw, ImageFilter
          import math

          root = Path("decoded")
          manifest = root / "AndroidManifest.xml"
          tree = ET.parse(manifest)
          m = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          app = m.find("application")
          if app is None:
              raise SystemExit("AndroidManifest.xml has no application element")
          app.set(ns + "label", "O/U-KTV")
          app.set(ns + "icon", "@mipmap/ic_launcher")
          app.set(ns + "roundIcon", "@mipmap/ic_launcher_round")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          # Create a polished O/U-KTV launcher mark: deep midnight background,
          # cyan/pink neon audio rings, a central microphone, and equalizer accents.
          S = 512
          im = Image.new("RGBA", (S, S), (5, 8, 25, 255))
          # Subtle radial blue-violet background glow
          pix = im.load()
          for y in range(S):
              for x in range(S):
                  dx, dy = (x-S/2)/(S*.78), (y-S/2)/(S*.78)
                  g = max(0, 1-math.sqrt(dx*dx+dy*dy))
                  pix[x,y] = (int(5+12*g), int(8+7*g), int(25+42*g), 255)
          glow = Image.new("RGBA", (S,S), (0,0,0,0))
          d = ImageDraw.Draw(glow)
          # Rounded neon frame and sound-wave arcs
          d.rounded_rectangle((34,34,478,478), radius=112, outline=(0,220,255,210), width=9)
          d.arc((72,90,440,458), 205, 335, fill=(0,225,255,220), width=12)
          d.arc((92,70,420,398), 25, 155, fill=(255,45,190,210), width=10)
          # Microphone body with layered neon outline
          d.rounded_rectangle((198,104,314,316), radius=58, fill=(14,23,55,255), outline=(0,235,255,255), width=13)
          d.rounded_rectangle((217,124,295,296), radius=39, outline=(255,55,198,255), width=7)
          # Mic grille
          for yy in (166,190,214,238):
              d.line((232,yy,280,yy), fill=(0,225,255,210), width=5)
          # Stand and cradle
          d.arc((151,188,361,386), 0, 180, fill=(0,235,255,255), width=14)
          d.line((256,386,256,426), fill=(0,235,255,255), width=14)
          d.line((202,426,310,426), fill=(255,55,198,255), width=12)
          # Equalizer bars at the base sides
          for x,h,col in [(112,46,(255,55,198,255)),(139,78,(0,225,255,255)),(360,78,(0,225,255,255)),(387,46,(255,55,198,255))]:
              d.rounded_rectangle((x,338-h//2,x+13,338+h//2), radius=6, fill=col)
          glow = glow.filter(ImageFilter.GaussianBlur(1.0))
          im = Image.alpha_composite(im, glow)
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for density,size in sizes.items():
              d = root / "res" / f"mipmap-{density}"
              d.mkdir(parents=True, exist_ok=True)
              icon = im.resize((size,size), Image.Resampling.LANCZOS)
              icon.save(d/"ic_launcher.png")
              icon.save(d/"ic_launcher_round.png")
          PY

      - name: Inspect packaged app for registration code
        shell: bash
        run: |
          set -euo pipefail
          echo "Decoded APK file inventory:"
          find decoded -type f | sort | head -300
          echo "Files containing registration/auth markers:"
          grep -RIlE 'Unregistered device|showRegistrationModal|register-modal|email_login_enabled|Registration failed' decoded || true
          echo "Registration-related text matches:"
          grep -RInE 'Unregistered device|showRegistrationModal|register-modal|email_login_enabled|Registration failed' decoded --include='*.js' --include='*.html' --include='*.xml' | head -200 || true

      - name: Rebuild APK
        run: apktool b decoded -o rebranded-unsigned.apk

      - name: Align and sign APK
        shell: bash
        run: |
          set -euo pipefail
          zipalign -f 4 rebranded-unsigned.apk rebranded-aligned.apk
          keytool -genkeypair -v -keystore ouktv-rebrand.keystore -storepass changeit -keypass changeit -alias ouktv -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=OU KTV, OU=Apps, O=OUTheBuilder, L=Unknown, S=Unknown, C=PH"
          apksigner sign --ks ouktv-rebrand.keystore --ks-pass pass:changeit --key-pass pass:changeit --out O-U-KTV.apk rebranded-aligned.apk
          apksigner verify --verbose O-U-KTV.apk

      - name: Verify package and app label
        run: |
          aapt dump badging O-U-KTV.apk | tee apk-metadata.txt
          grep -F "package: name='com.ouktv.app'" apk-metadata.txt
          grep -F "application-label:'O/U-KTV'" apk-metadata.txt

      - name: Upload rebranded APK
        uses: actions/upload-artifact@v4
        with:
          name: OU-KTV-rebranded-apk
          path: O-U-KTV.apk
          if-no-files-found: error
